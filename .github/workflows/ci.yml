name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fieldops?schema=public
      AUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters-long
      OPERATIONAL_TIMEZONE: Asia/Kolkata
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm is installed in the next step. Disabling automatic caching
          # avoids setup-node attempting to resolve pnpm before it exists.
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate types, schema, tests, and web build
        run: |
          pnpm check
          pnpm check:serverless
          pnpm prisma:validate
          pnpm test
          pnpm build:web
