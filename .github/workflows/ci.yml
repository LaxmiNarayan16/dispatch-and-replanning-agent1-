name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fieldops?schema=public
      AUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters-long
      OPERATIONAL_TIMEZONE: Asia/Kolkata
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          # pnpm/setup uses its standalone binary and avoids legacy Node 20
          # action runtimes. pnpm 11 reads this repository's lockfile v9.
          version: 11
          runtime: node@22
          cache: true

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate types, schema, tests, and web build
        run: |
          pnpm check
          pnpm check:serverless
          pnpm prisma:validate
          pnpm test
          pnpm build:web
